name: CI

# Runs Pest, Pint, Rector, PHPStan, the PHP 8.2 floor lint, the download archive check and the
# aggregate-needs check on every pull request and on pushes to master. The mutation jobs of the
# shared code-quality chain are a separate ticket and are not wired here.
#
# The last job, `CI`, is the one check a ruleset requires from this workflow (with the two
# pull-request-body checks, `Attribution footer` and `Closing keywords`). It `needs:` every other
# job here, runs `if: always()`, and fails unless each reports `success`: a `skipped` or
# `cancelled` job fails it. Do not rename `CI`. A job added to this file goes into the `needs:`
# of `CI` in the same change; the `aggregate-needs` job fails when one is missing.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pest:
    name: Pest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Pest
        run: composer test

  # The supported floor is PHP 8.2 while the suite runs on 8.4: parse every shipped PHP file on 8.2
  # so syntax newer than the floor fails here. tests/, vendor/ and the synced agent folders are not shipped.
  lint-floor:
    name: Floor lint (PHP 8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Parse every shipped PHP file
        run: |
          count=0
          while IFS= read -r file; do
            php -l "$file"
            count=$((count + 1))
          done < <(git ls-files '*.php' ':!:tests/**' ':!:vendor/**' ':!:.claude/**' ':!:.agents/**' ':!:.cursor/**')
          echo "Linted $count file(s)"
          test "$count" -gt 0

  # Formatting, with the `laravel` preset.
  pint:
    name: Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Pint
        run: composer test:pint

  # The gating Rector profile, previewed: fails when it would change a file.
  rector:
    name: Rector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Rector
        run: composer test:refactor

  # Static analysis at the level in phpstan.neon.dist.
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: PHPStan
        run: composer stan

  # Fails when a GitHub download of this repository would carry anything but what the plugin
  # runs: the synced agent folders, AGENTS.md, docs, tests, scripts, lock files or tool
  # configuration. It lists `git archive` of the checked-out commit with the keep-list in
  # `.gitattributes` applied, so a new top-level folder the keep-list does not name fails the
  # pull request that adds it. Reported here, not by a separate workflow, so `CI` waits on it.
  download-archive:
    name: Download archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check that the download holds only what the plugin runs
        run: node .claude/skills/download-archive-check/check-download-archive.mjs

  # Fails, naming the job, when a job in this file is missing from the `needs:` list of `CI`, or
  # when one of the three fixed required names is reported by no pull request workflow.
  aggregate-needs:
    name: Aggregate needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check the aggregate covers every job
        run: node .claude/skills/code-quality/scripts/check-aggregate-needs.mjs

  # The one check a ruleset requires from this workflow. Keep `needs:` naming every other job.
  ci:
    name: CI
    needs: [pest, lint-floor, pint, rector, phpstan, download-archive, aggregate-needs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list (an emptied `needs:`, a dropped `env:`) would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
